name: 🔒 TechVision AI Security Scanning Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scan every day at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write
  checks: write
  pull-requests: write

jobs:
  # ============================================
  # SECURITY SCANNING JOB
  # ============================================
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    # ============================================
    # 1. CHECKOUT REPOSITORY
    # ============================================
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    # ============================================
    # 2. SETUP PYTHON ENVIRONMENT
    # ============================================
    - name: 🐍 Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
        
    # ============================================
    # 3. INSTALL SECURITY TOOLS
    # ============================================
    - name: 📦 Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit semgrep pylint safety
        echo "✅ Security tools installed"
        
    - name: ✅ Verify Tool Installation
      run: |
        echo "=== Tool Versions ==="
        bandit --version
        semgrep --version
        pylint --version
        safety --version
        
    # ============================================
    # 4. CREATE OUTPUT DIRECTORY
    # ============================================
    - name: 📂 Create Reports Directory
      run: mkdir -p security-reports
        
    # ============================================
    # 5. RUN BANDIT SECURITY SCAN
    # ============================================
    - name: 🔍 Bandit - Python Security Analysis
      id: bandit
      continue-on-error: true
      run: |
        echo "🔍 Running Bandit security scan..."
        
        # JSON output for parsing
        bandit -r . \
          -f json \
          -o security-reports/bandit-results.json \
          --exclude './venv,./.*,**/test*' || true
          
        # Text output for humans
        bandit -r . \
          -f txt \
          -o security-reports/bandit-results.txt \
          --exclude './venv,./.*,**/test*' || true
          
        # Count findings by severity
        if [ -f security-reports/bandit-results.json ]; then
          CRITICAL=$(grep -o '"severity": "CRITICAL"' security-reports/bandit-results.json | wc -l || echo "0")
          HIGH=$(grep -o '"severity": "HIGH"' security-reports/bandit-results.json | wc -l || echo "0")
          MEDIUM=$(grep -o '"severity": "MEDIUM"' security-reports/bandit-results.json | wc -l || echo "0")
          LOW=$(grep -o '"severity": "LOW"' security-reports/bandit-results.json | wc -l || echo "0")
          
          echo "📊 Bandit Results:"
          echo "  CRITICAL: $CRITICAL"
          echo "  HIGH: $HIGH"
          echo "  MEDIUM: $MEDIUM"
          echo "  LOW: $LOW"
        fi
        
    # ============================================
    # 6. RUN SEMGREP SCAN
    # ============================================
    - name: 🎯 Semgrep - Pattern-Based Detection
      id: semgrep
      continue-on-error: true
      run: |
        echo "🎯 Running Semgrep pattern scan..."
        
        # Security audit configuration
        semgrep \
          --config=p/security-audit \
          . \
          --json \
          --output=security-reports/semgrep-results.json \
          --exclude='test*,venv' || true
          
        echo "✅ Semgrep scan complete"
        
    # ============================================
    # 7. RUN PYLINT ANALYSIS
    # ============================================
    - name: 📋 PyLint - Code Quality & Security
      id: pylint
      continue-on-error: true
      run: |
        echo "📋 Running PyLint security analysis..."
        
        pylint . \
          --disable=all \
          --enable=E,W \
          --recursive=y \
          --exit-zero \
          -f json > security-reports/pylint-results.json 2>&1 || true
          
        echo "✅ PyLint scan complete"
        
    # ============================================
    # 8. CHECK DEPENDENCIES FOR VULNERABILITIES
    # ============================================
    - name: 🔗 Safety - Dependency Check
      id: safety
      continue-on-error: true
      run: |
        echo "🔗 Checking dependency vulnerabilities..."
        
        if [ -f requirements.txt ]; then
          safety check -r requirements.txt --json > security-reports/safety-results.json 2>&1 || true
        else
          safety check --json > security-reports/safety-results.json 2>&1 || true
        fi
        
        echo "✅ Dependency check complete"
        
    # ============================================
    # 9. CRITICAL ISSUE CHECK
    # ============================================
    - name: 🚨 Check for CRITICAL Issues
      id: critical-check
      continue-on-error: true
      run: |
        echo "🚨 Analyzing security findings..."
        
        HAS_CRITICAL=false
        
        if [ -f security-reports/bandit-results.json ]; then
          CRITICAL_COUNT=$(grep -c '"severity": "CRITICAL"' security-reports/bandit-results.json || echo "0")
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "⚠️ CRITICAL issues found: $CRITICAL_COUNT"
            HAS_CRITICAL=true
          fi
        fi
        
        # On pull requests, fail if CRITICAL issues exist
        if [ "$HAS_CRITICAL" = true ] && [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "❌ Pull request blocked: CRITICAL vulnerabilities detected"
          exit 1
        fi
        
    # ============================================
    # 10. UPLOAD SCAN ARTIFACTS
    # ============================================
    - name: 📤 Upload Scan Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports-${{ github.run_id }}
        path: security-reports/
        retention-days: 90
        
    # ============================================
    # 11. COMMENT ON PR WITH RESULTS
    # ============================================
    - name: 💬 Add PR Comment with Findings
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          let comment = '## 🔒 Security Scan Results\n\n';
          
          try {
            const bandit = JSON.parse(fs.readFileSync('security-reports/bandit-results.json', 'utf8'));
            const total = bandit.results.length;
            const critical = bandit.results.filter(r => r.severity === 'CRITICAL').length;
            const high = bandit.results.filter(r => r.severity === 'HIGH').length;
            
            comment += `### Bandit Findings\n`;
            comment += `- Total Issues: ${total}\n`;
            comment += `- CRITICAL: ${critical} ${critical > 0 ? '🚨' : '✅'}\n`;
            comment += `- HIGH: ${high}\n\n`;
            
            if (critical > 0) {
              comment += `⚠️ **Please fix CRITICAL issues before merging**\n`;
            }
          } catch (e) {
            comment += `Could not parse Bandit results\n`;
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # ============================================
  # REPORT GENERATION JOB
  # ============================================
  generate-report:
    needs: security-scan
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: 📊 Generate Security Summary
        run: |
          cat > security-summary.txt << 'EOF'
          ╔════════════════════════════════════════════════════════════╗
          ║          TECHVISION AI SECURITY SCAN SUMMARY                ║
          ╚════════════════════════════════════════════════════════════╝
          
          Scan Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          
          TOOLS EXECUTED:
          ✓ Bandit (Python security linter)
          ✓ Semgrep (Pattern-based scanner)
          ✓ PyLint (Code quality and security)
          ✓ Safety (Dependency vulnerability checker)
          
          ACTION ITEMS:
          1. Review detailed scan reports in artifacts
          2. Prioritize CRITICAL/HIGH findings
          3. Submit remediation pull request
          4. Re-run scan to verify fixes
          5. Document all remediations
          
          For more details, visit:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          cat security-summary.txt
          
      - name: 📤 Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.txt